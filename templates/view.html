<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ item.name }} — LAN Share</title>
<style>body{margin:0;background:#0b1020;color:#edf3ff;font:15px/1.6 system-ui,sans-serif}.wrap{max-width:900px;margin:45px auto;padding:20px}.box{background:#131b2e;border:1px solid #26334d;border-radius:16px;padding:24px}h1{overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#080e1b;padding:18px;border-radius:10px;border:1px solid #26334d;font:14px/1.6 ui-monospace,monospace}.btn,button{background:#8b9cff;color:#10162b;border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none;margin-right:8px}.muted{color:#9aa9c2}</style></head><body><main class="wrap"><div class="box"><p class="muted">LAN SHARE / TEXT</p><h1>{{ item.name }}</h1><pre id="shared-text">{{ content }}</pre><button onclick="copyText()">Copy text</button><a class="btn" href="{{ url_for('browse', folder_id=back) if back else url_for('index') }}">Back</a><p id="status" class="muted"></p></div></main><script>async function copyText(){const t=document.querySelector('#shared-text').innerText;try{await navigator.clipboard.writeText(t);document.querySelector('#status').textContent='Copied to clipboard.'}catch(e){const r=document.createRange();r.selectNodeContents(document.querySelector('#shared-text'));const s=window.getSelection();s.removeAllRanges();s.addRange(r);document.querySelector('#status').textContent='Select the text and copy it manually.'}}</script></body></html>
